name: Publish Maarch POC image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ngsign/maarch-poc-app
  # Override these GitHub repository variables to pin your exact Maarch source.
  # Defaults match the source used by the POC documentation.
  MAARCH_FRONTEND_REPOSITORY: ${{ vars.MAARCH_FRONTEND_REPOSITORY || 'cedlerouge/MaarchCourrier' }}
  MAARCH_FRONTEND_REF: ${{ vars.MAARCH_FRONTEND_REF || 'main' }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the NGSign plugin
        uses: actions/checkout@v4

      - name: Check out Maarch frontend sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAARCH_FRONTEND_REPOSITORY }}
          ref: ${{ env.MAARCH_FRONTEND_REF }}
          path: .maarch-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .maarch-source/package-lock.json

      - name: Build the NGSign-aware Maarch frontend
        shell: bash
        run: |
          set -euo pipefail
          node poc/app/prepare-ngsign-frontend.mjs "$GITHUB_WORKSPACE/.maarch-source" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/.maarch-source"
          npm config set legacy-peer-deps true
          npm ci --no-audit --no-fund
          npm run build
          rm -rf "$GITHUB_WORKSPACE/poc/app/dist"
          mkdir -p "$GITHUB_WORKSPACE/poc/app/dist"
          cp -a dist/. "$GITHUB_WORKSPACE/poc/app/dist/"
          test -f "$GITHUB_WORKSPACE/poc/app/dist/index.html"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: poc/app/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
